name: Repo Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repo-validation:
    name: Repo Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python3 -m pip install --disable-pip-version-check --no-input jsonschema
      - name: Validate organ contract
        run: python3 scripts/validate_organ_contract.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Parse JSON contracts
        shell: bash
        run: |
          set -euo pipefail
          for contract in contracts/*.json; do
            python3 -m json.tool "$contract" >/dev/null
          done
